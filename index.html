<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disrxght - Dynamic Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
            position: relative;
        }

        /* Main background image */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('Disrxght.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Mobile optimization - show full image */
        @media (max-width: 768px) {
            .background-container {
                background-size: contain;
                background-position: center center;
            }
        }

        @media (orientation: portrait) {
            .background-container {
                background-size: 100% auto;
                background-position: center center;
            }
        }

        /* Animated gradient overlay - GREEN/TEAL theme */
        .gradient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), 
                rgba(0, 255, 157, 0.15) 0%, 
                rgba(0, 128, 128, 0.1) 30%, 
                transparent 60%);
            z-index: 2;
            animation: pulseOverlay 5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulseOverlay {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        /* Teal/Cyan mist effect */
        .mist {
            position: fixed;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(ellipse at center, 
                transparent 0%, 
                rgba(0, 128, 128, 0.08) 40%, 
                rgba(32, 178, 170, 0.12) 70%, 
                transparent 100%);
            z-index: 3;
            animation: rotateMist 40s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateMist {
            from { transform: rotate(0deg) scale(1); }
            to { transform: rotate(360deg) scale(1.1); }
        }

        /* Floating particles - GREEN/TEAL/CYAN theme */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
            filter: blur(1px);
        }

        .particle-teal {
            background: radial-gradient(circle, rgba(0, 128, 128, 0.7), rgba(0, 128, 128, 0));
            animation: floatTeal 8s ease-in-out infinite;
        }

        .particle-cyan {
            background: radial-gradient(circle, rgba(0, 255, 255, 0.6), rgba(0, 255, 255, 0));
            animation: floatCyan 10s ease-in-out infinite;
        }

        .particle-green {
            background: radial-gradient(circle, rgba(0, 255, 157, 0.7), rgba(0, 255, 157, 0));
            animation: floatGreen 12s ease-in-out infinite;
        }

        @keyframes floatTeal {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.5;
            }
            25% {
                transform: translate(25px, -35px) scale(1.3);
                opacity: 0.8;
            }
            50% {
                transform: translate(-20px, -70px) scale(0.9);
                opacity: 0.6;
            }
            75% {
                transform: translate(-35px, -35px) scale(1.2);
                opacity: 0.7;
            }
        }

        @keyframes floatCyan {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0.4;
            }
            33% {
                transform: translate(-30px, -50px) rotate(120deg);
                opacity: 0.7;
            }
            66% {
                transform: translate(30px, -90px) rotate(240deg);
                opacity: 0.5;
            }
        }

        @keyframes floatGreen {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translateY(-110px) scale(1.4);
                opacity: 0.9;
            }
        }

        /* Glowing orbs - teal/cyan glow */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
            filter: blur(50px);
            animation: glowPulse 5s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.25;
            }
            50% {
                transform: scale(1.6);
                opacity: 0.5;
            }
        }

        /* Vignette effect - darker for urban feel */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, 
                transparent 0%, 
                transparent 40%, 
                rgba(0, 0, 0, 0.6) 100%);
            z-index: 6;
            pointer-events: none;
        }

        /* Light rays - subtle teal */
        .light-ray {
            position: absolute;
            width: 2px;
            height: 180px;
            background: linear-gradient(to bottom, 
                rgba(0, 255, 157, 0.3), 
                transparent);
            z-index: 4;
            pointer-events: none;
            animation: shimmer 4s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes shimmer {
            0%, 90%, 100% { opacity: 0; }
            10%, 20% { opacity: 0.6; }
            15% { opacity: 0.3; }
        }

        /* Scan lines for gritty effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.05),
                rgba(0, 0, 0, 0.05) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 7;
            pointer-events: none;
            animation: scanlineMove 8s linear infinite;
        }

        @keyframes scanlineMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }

        /* Noise texture overlay */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2.5' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            z-index: 8;
            pointer-events: none;
            animation: noiseAnim 0.2s infinite;
        }

        @keyframes noiseAnim {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -5%); }
            20% { transform: translate(-10%, 5%); }
            30% { transform: translate(5%, -10%); }
            40% { transform: translate(-5%, 15%); }
            50% { transform: translate(-10%, 5%); }
            60% { transform: translate(15%, 0); }
            70% { transform: translate(0, 10%); }
            80% { transform: translate(-15%, 0); }
            90% { transform: translate(10%, 5%); }
        }

        /* Glitch effect overlay */
        .glitch {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(0, 255, 157, 0.1) 50%,
                transparent 100%
            );
            z-index: 9;
            pointer-events: none;
            opacity: 0;
            animation: glitchAnim 8s ease-in-out infinite;
        }

        @keyframes glitchAnim {
            0%, 96%, 100% { 
                opacity: 0; 
                transform: translateX(0);
            }
            97% { 
                opacity: 0.8; 
                transform: translateX(-10px);
            }
            98% { 
                opacity: 0.6; 
                transform: translateX(10px);
            }
            99% { 
                opacity: 0.4; 
                transform: translateX(-5px);
            }
        }

        /* Corner accent glow */
        .corner-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 3;
        }

        .corner-glow-tl {
            top: -150px;
            left: -150px;
            background: radial-gradient(circle, rgba(0, 255, 157, 0.2), transparent);
            animation: cornerPulse 6s ease-in-out infinite;
        }

        .corner-glow-br {
            bottom: -150px;
            right: -150px;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.15), transparent);
            animation: cornerPulse 6s ease-in-out infinite 3s;
        }

        @keyframes cornerPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        /* Mouse trail effect */
        .mouse-trail {
            position: fixed;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 157, 0.6), transparent);
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* Ambient light shift */
        .ambient-shift {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(0, 128, 128, 0.1) 0%,
                transparent 50%,
                rgba(0, 255, 157, 0.08) 100%
            );
            z-index: 2;
            animation: ambientShift 20s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes ambientShift {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <!-- Main background -->
    <div class="background-container"></div>

    <!-- Ambient effects -->
    <div class="ambient-shift"></div>
    <div class="gradient-overlay"></div>
    <div class="mist"></div>

    <!-- Corner glows -->
    <div class="corner-glow corner-glow-tl"></div>
    <div class="corner-glow corner-glow-br"></div>

    <!-- Floating particles -->
    <div class="particle particle-teal" style="width: 10px; height: 10px; top: 15%; left: 12%;"></div>
    <div class="particle particle-cyan" style="width: 14px; height: 14px; top: 35%; left: 75%;"></div>
    <div class="particle particle-green" style="width: 8px; height: 8px; top: 55%; left: 20%;"></div>
    <div class="particle particle-teal" style="width: 12px; height: 12px; top: 75%; left: 65%;"></div>
    <div class="particle particle-cyan" style="width: 16px; height: 16px; top: 25%; left: 50%;"></div>
    <div class="particle particle-green" style="width: 9px; height: 9px; top: 65%; left: 35%;"></div>
    <div class="particle particle-teal" style="width: 11px; height: 11px; top: 85%; left: 80%;"></div>
    <div class="particle particle-cyan" style="width: 13px; height: 13px; top: 45%; left: 10%;"></div>

    <!-- Glowing orbs -->
    <div class="glow-orb" style="width: 200px; height: 200px; top: 20%; left: 70%; background: rgba(0, 255, 157, 0.3);"></div>
    <div class="glow-orb" style="width: 250px; height: 250px; top: 60%; left: 15%; background: rgba(0, 255, 255, 0.25); animation-delay: 2.5s;"></div>
    <div class="glow-orb" style="width: 180px; height: 180px; top: 40%; right: 10%; background: rgba(0, 128, 128, 0.2); animation-delay: 1.5s;"></div>

    <!-- Light rays -->
    <div class="light-ray" style="top: 12%; left: 28%; animation-delay: 0s;"></div>
    <div class="light-ray" style="top: 25%; left: 68%; animation-delay: 1.2s;"></div>
    <div class="light-ray" style="top: 55%; left: 15%; animation-delay: 2.5s;"></div>
    <div class="light-ray" style="top: 72%; left: 82%; animation-delay: 0.8s;"></div>
    <div class="light-ray" style="top: 38%; left: 45%; animation-delay: 3s;"></div>

    <!-- Effects overlays -->
    <div class="vignette"></div>
    <div class="scanlines"></div>
    <div class="noise"></div>
    <div class="glitch"></div>

    <!-- Mouse trail -->
    <div class="mouse-trail" id="mouseTrail"></div>

    <script>
        // Dynamic mouse tracking for gradient overlay
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            
            document.querySelector('.gradient-overlay').style.setProperty('--x', x + '%');
            document.querySelector('.gradient-overlay').style.setProperty('--y', y + '%');

            // Mouse trail effect
            const trail = document.getElementById('mouseTrail');
            trail.style.left = e.clientX - 7.5 + 'px';
            trail.style.top = e.clientY - 7.5 + 'px';
            trail.style.opacity = '1';
        });

        document.addEventListener('mouseleave', () => {
            document.getElementById('mouseTrail').style.opacity = '0';
        });

        // Add more dynamic particles
        function createDynamicParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            const types = ['particle-teal', 'particle-cyan', 'particle-green'];
            const randomType = types[Math.floor(Math.random() * types.length)];
            particle.classList.add(randomType);
            
            const size = Math.random() * 12 + 6;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 6 + 7) + 's';
            particle.style.animationDelay = Math.random() * 3 + 's';
            
            document.body.appendChild(particle);
            
            setTimeout(() => {
                if (particle.parentNode) {
                    particle.parentNode.removeChild(particle);
                }
            }, 15000);
        }

        // Create particles periodically
        setInterval(createDynamicParticle, 4000);

        // Click spark effect
        document.addEventListener('click', (e) => {
            createSpark(e.clientX, e.clientY);
        });

        function createSpark(x, y) {
            for (let i = 0; i < 8; i++) {
                const spark = document.createElement('div');
                spark.style.position = 'fixed';
                spark.style.left = x + 'px';
                spark.style.top = y + 'px';
                spark.style.width = '3px';
                spark.style.height = '3px';
                spark.style.background = 'rgba(0, 255, 157, 0.9)';
                spark.style.borderRadius = '50%';
                spark.style.pointerEvents = 'none';
                spark.style.zIndex = '1000';
                spark.style.boxShadow = '0 0 10px rgba(0, 255, 157, 0.8)';
                
                const angle = (i / 8) * Math.PI * 2;
                const velocity = 60;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;
                
                spark.style.transition = 'transform 0.6s ease-out, opacity 0.6s ease-out';
                document.body.appendChild(spark);
                
                setTimeout(() => {
                    spark.style.opacity = '0';
                    spark.style.transform = `translate(${vx}px, ${vy}px) scale(0)`;
                }, 20);
                
                setTimeout(() => {
                    if (spark.parentNode) {
                        spark.parentNode.removeChild(spark);
                    }
                }, 620);
            }
        }

        // Random glitch trigger
        function triggerGlitch() {
            const glitch = document.querySelector('.glitch');
            glitch.style.animation = 'none';
            setTimeout(() => {
                glitch.style.animation = 'glitchAnim 0.3s ease-in-out';
            }, 10);
        }

        setInterval(() => {
            if (Math.random() > 0.7) {
                triggerGlitch();
            }
        }, 5000);

        // Ambient breathing effect
        let breathPhase = 0;
        function ambientBreathing() {
            breathPhase += 0.01;
            const overlay = document.querySelector('.gradient-overlay');
            const intensity = 0.5 + Math.sin(breathPhase) * 0.2;
            overlay.style.opacity = intensity;
            requestAnimationFrame(ambientBreathing);
        }
        ambientBreathing();
    </script>
</body>
</html>
